<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Школьная Демократия - управляй школой!</title>

  <link rel="stylesheet" href="style.css">

  <!-- Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <header>
    <div class="header_container">

      <img
        src="ЛОГО СИНИЙ.png"
        alt="Школьная демократия"
        class="logo"
      >

      <p class="header_text">
        ШКОЛЬНАЯ ДЕМОКРАТИЯ
      </p>

    </div>
  </header>

  <main>
    <div class="hero_container">
      <div class="text_hero_container">
        <h1>Управляй школой <span class="hero_lined">свайпом</span></h1>
        <p>Анонимное голосование, жалобы, важные новости</p>
      </div>
      <div class="hero_image_container">
        <img src="lucid-origin_professional_photo_of_3D_icon_isometric_view_blue_ballot_box_with_a_slit_on_top_-0 1.svg" alt="" class="hero_image">
      </div>
    </div>

    <div class="slider-container">
  <div class="slider">
    <div class="slider-track" id="sliderTrack">
      <!-- ДОБАВЛЕН ID="sliderThumb" -->
      <div class="slider-thumb" id="sliderThumb">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z" fill="white"/>
        </svg>
      </div>
      <!-- ДОБАВЛЕН ID="sliderText" -->
      <span class="slider-text" id="sliderText">сдвинь чтобы войти</span>
      <!-- ДОБАВЛЕН ТЕКСТ ВНУТРИ МАСКИ И ID -->
      <div class="slider-text-mask" id="sliderTextMask">
        <span class="slider-text" id="sliderTextMasked"></span>
      </div>
    </div>
  </div>
</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
